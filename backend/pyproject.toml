[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-console-backend"
version = "0.1.0"
description = "comfyui-console backend — FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "websockets>=14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "pyjwt>=2.10",
  "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]