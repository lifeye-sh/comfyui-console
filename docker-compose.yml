services:
  pose-gallery:
    build: ./apps/pose-gallery
    volumes:
      - ${POSE_GALLERY_ASSETS:-../ai-pose-gallery-zh}/data:/usr/share/nginx/html/gallery/data:ro
      - ${POSE_GALLERY_ASSETS:-../ai-pose-gallery-zh}/img:/usr/share/nginx/html/gallery/img:ro
      - ${POSE_GALLERY_ASSETS:-../ai-pose-gallery-zh}/thumbs:/usr/share/nginx/html/gallery/thumbs:ro
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env:ro
    environment:
      - COMFY_CONSOLE_DATABASE_URL=sqlite:///./data/app.db
      - COMFY_CONSOLE_STORAGE_PATH=./data/resources
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - pose-gallery
    restart: unless-stopped
